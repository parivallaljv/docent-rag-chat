name: Docker
on:
  pull_request:
    paths: ["Dockerfile", "backend/**", "frontend/**", ".github/workflows/docker.yml"]
  push:
    branches: [main]
permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  OWNER: ${{ github.repository_owner }}

jobs:
  image:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { name: docent-api, context: ., file: Dockerfile }
          - { name: docent-web, context: frontend, file: frontend/Dockerfile }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name == 'push'
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          load: true
          tags: ${{ matrix.name }}:ci
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
      - name: Trivy scan
        uses: aquasecurity/trivy-action@v0.28.0
        with:
          image-ref: ${{ matrix.name }}:ci
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
      - name: Push to GHCR
        if: github.event_name == 'push'
        run: |
          IMG=${{ env.REGISTRY }}/$(echo "${{ env.OWNER }}" | tr A-Z a-z)/${{ matrix.name }}
          docker tag ${{ matrix.name }}:ci $IMG:${{ github.sha }}
          docker tag ${{ matrix.name }}:ci $IMG:latest
          docker push $IMG:${{ github.sha }}
          docker push $IMG:latest
